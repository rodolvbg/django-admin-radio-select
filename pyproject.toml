[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-radio-select"
version = "0.1.0"
description = "Synchronize BooleanFields across Django Admin inline rows as mutually exclusive radio button groups."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodolfo Becerra", email = "rodolvbg@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rodolvbg/django-admin-radio-select"
Repository = "https://github.com/rodolvbg/django-admin-radio-select"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "coverage[toml]>=7.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_admin_radio_select*"]

[tool.setuptools.package-data]
django_admin_radio_select = ["py.typed", "static/django_admin_radio_select/*.js"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example.settings"
pythonpath = ["src", "example"]
addopts = "--no-migrations"
testpaths = ["tests"]

[tool.coverage.run]
source = ["django_admin_radio_select"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
mypy_path = "src:example"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.django-stubs]
django_settings_module = "example.settings"
